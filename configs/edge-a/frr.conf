frr defaults traditional
hostname edge-a
log stdout
service integrated-vtysh-config
!
interface eth1
 description to core
 ip address 10.0.0.2/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 10
!
interface eth2
 description to edge-b
 ip address 10.0.0.9/30
 ip ospf area 0.0.0.0
 ip ospf network point-to-point
 ip ospf cost 50
!
interface eth3
 description ebgp-to-isp-a
 ip address 172.16.0.1/30
!
ip prefix-list FROM-ISP seq 10 permit 0.0.0.0/0
ip prefix-list TO-ISP seq 10 permit 10.70.10.0/24
!
router ospf
 ospf router-id 10.255.0.2
 passive-interface default
 no passive-interface eth1
 no passive-interface eth2
 default-information originate metric 5 metric-type 1
!
router bgp 65010
 bgp router-id 10.255.0.2
 no bgp default ipv4-unicast
 neighbor 172.16.0.2 remote-as 65110
 !
 address-family ipv4 unicast
  neighbor 172.16.0.2 activate
  neighbor 172.16.0.2 prefix-list FROM-ISP in
  neighbor 172.16.0.2 prefix-list TO-ISP out
  network 10.70.10.0/24
 exit-address-family
!
line vty
