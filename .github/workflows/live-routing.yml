name: Live routing lab validation

on:
  push:
    paths:
      - 'topology.clab.yml'
      - 'configs/**'
      - 'scripts/**'
      - '.github/workflows/live-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containerlab-routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Containerlab v0.82.0
        run: |
          curl -fsSL https://get.containerlab.dev -o /tmp/install-containerlab.sh
          sudo bash /tmp/install-containerlab.sh -v 0.82.0
          containerlab version
          docker info --format '{{.ServerVersion}}'
      - name: Deploy simulated routing lab
        run: sudo containerlab deploy -t topology.clab.yml
      - name: Apply and verify FRR startup configurations
        run: bash scripts/bootstrap.sh
      - name: Routing diagnostics after bootstrap
        run: |
          for router in core edge-a edge-b isp-a isp-b transit; do
            echo "===== $router ====="
            docker exec "clab-industrial-routing-$router" vtysh -c 'show ip route' || true
            docker exec "clab-industrial-routing-$router" vtysh -c 'show bgp ipv4 unicast summary' || true
          done
          docker exec clab-industrial-routing-core vtysh -c 'show ip ospf neighbor' || true
      - name: Verify OSPF, BGP and end-to-end connectivity
        timeout-minutes: 5
        run: bash scripts/verify.sh
      - name: Verify WAN failover and restoration
        timeout-minutes: 5
        run: bash scripts/failover.sh
      - name: Destroy lab
        if: always()
        run: sudo containerlab destroy -t topology.clab.yml --cleanup || true
