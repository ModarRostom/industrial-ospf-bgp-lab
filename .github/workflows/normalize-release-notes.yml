name: Update v1.0.0 release description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-release-notes.yml'

permissions:
  contents: write

jobs:
  update-release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Replace published release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          data="$(gh api "repos/${GITHUB_REPOSITORY}/releases/437440747")"
          echo "$data" | jq -e '.tag_name == "v1.0.0" and .draft == false' >/dev/null
          test -s docs/releases/v1.0.0.md
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/437440747" \
            -f body="$(cat docs/releases/v1.0.0.md)" \
            --jq '{tag_name, draft, html_url}'
